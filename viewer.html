<style>

  .nav.prev { left: 8px; } .nav.next { right: 8px; }

  .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; }

  .sec-h { margin: 6px 0 -4px; font-size: 13px; font-weight: 800; letter-spacing: .5px; color: var(--sub); text-transform: uppercase; }

  .rrow ul li { margin-bottom: 6px; }

  /* Project Report look: always light (even when the phone is in dark mode), pale blue unit bands,

  html.report.report { color-scheme: light; --bg: #FFFFFF; --card: #FFFFFF; --field: #ECEEF4; --ink: #15163A; --sub: #5B5E7A; --line: #E1E4EC;
    --accent: #E8701A; --accentInk: #B4540A; --accentSoft: #FFF1E5; --link: #1D4ED8; --blue: #1D4ED8; --blueSoft: #EAF1FF; }

  html.report.report .unit-h { background: var(--blueSoft); color: var(--blue); }
  html.report.report .unit-h span { color: #3B4A6B; opacity: 1; }

  @media print {
    @page { size: letter; margin: 0.5in; }

    .rrow { break-inside: avoid; page-break-inside: avoid; flex-wrap: nowrap; border: 0; border-bottom: 1px solid #E1E4EC; border-radius: 0; padding: 12px 0; }
    .rrow .picw { flex: 0 0 52%; }
    .rrow .more img { height: 1in; }
    .rrow .pic img { max-height: 3.6in; }
    ol.sum li { break-inside: avoid; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

    h.appendChild(el('p', { class: 'meta', text: parts.join(' · ') }));
    var btns = el('div', { class: 'btns' });
    var pdf = el('button', { class: 'dlall', type: 'button' });
    pdf.appendChild(svg(ICON_DL));
    pdf.appendChild(document.createTextNode('Download PDF'));
    pdf.addEventListener('click', function () { window.print(); });
    btns.appendChild(pdf);
    if (okId(data.f)) {
      var a = el('a', { class: 'dlall', href: 'https://drive.google.com/drive/folders/' + data.f, target: '_blank', rel: 'noopener' });
      a.appendChild(svg(ICON_DL));
      a.appendChild(document.createTextNode('Download all photos'));
      btns.appendChild(a);
    }
    h.appendChild(btns);
    return h;
  }

  // One report item = one photo, or a group of photos of the same thing (the app sends the group's photos
  // next to each other with the same p.gi). The first photo of a group is shown big, the rest small.
  function reportRow(it, n) {
    var p = it.ps[0], i = it.i0;
    var row = el('section', { class: 'rrow' });
    var picw = el('div', { class: 'picw' });
    var pic = el('button', { class: 'pic', type: 'button', 'aria-label': 'Open photo full size, item ' + n });
    var img = el('img', { src: thumb(p.i, 1200), alt: 'Item ' + n, loading: n < 4 ? 'eager' : 'lazy' });
    img.onerror = function () { pic.innerHTML = ''; pic.appendChild(el('div', { class: 'missing', text: 'This photo is no longer shared.' })); };
    pic.appendChild(img);
    pic.appendChild(el('span', { class: 'num', text: String(n) }));
    pic.addEventListener('click', function () { openViewer(i); });
    picw.appendChild(pic);
    if (it.ps.length > 1) {
      var more = el('div', { class: 'more' });
      it.ps.slice(1).forEach(function (q, k) {
        var b = el('button', { type: 'button', 'aria-label': 'Open photo ' + (k + 2) + ' of item ' + n + ' full size' });
        var t = el('img', { src: thumb(q.i, 400), alt: 'Item ' + n + ', photo ' + (k + 2), loading: 'lazy' });
        t.onerror = function () { b.remove(); };
        b.appendChild(t);
        b.addEventListener('click', function () { openViewer(i + k + 1); });
        more.appendChild(b);
      });
      picw.appendChild(more);
    }
    row.appendChild(picw);
    var txt = el('div', { class: 'txt' });
    var h3 = el('h3', {}, [el('span', { class: 'rn', text: String(n) })]);
    h3.appendChild(document.createTextNode(it.ps.length > 1 ? 'Item ' + n + ' · ' + it.ps.length + ' photos' : 'Photo ' + n));
    if (p.u) h3.appendChild(el('span', { class: 'uchip', text: str(p.u, 40) }));
    txt.appendChild(h3);
    var meta = [];
    if (p.w) meta.push(fmtDate(p.w, true));
    if (p.b) meta.push(str(p.b, 80));
    if (meta.length) txt.appendChild(el('p', { class: 'meta', text: meta.join(' · ') }));
    var list = it.is;
    if (list.length) {
      var ul = el('ul');
      list.slice(0, 50).forEach(function (t) { ul.appendChild(el('li', { text: str(t) })); });
      txt.appendChild(ul);
    } else txt.appendChild(el('p', { class: 'none', text: it.ps.length > 1 ? 'No comment on these photos.' : 'No comment on this photo.' }));
    row.appendChild(txt);
    return row;
  }

  var main = el('main');
  if (isReport) {
    document.documentElement.classList.add('report');
    var metaScheme = el('meta', { name: 'color-scheme', content: 'light' });
    document.head.appendChild(metaScheme);
    document.title = (str(data.r.t, 120) || 'Project Report') + (data.t ? ' · ' + str(data.t, 120) : '');
    app.appendChild(reportHeader());
    // Items: a photo on its own, or a group of photos (same p.gi, sent next to each other).
    var items = [];
    photos.forEach(function (p, i) {
      var gi = typeof p.gi === 'number' && p.gi > 0 ? p.gi : 0;
      var last = items[items.length - 1];
      if (gi && last && last.gi === gi) last.ps.push(p);
      else items.push({ gi: gi, ps: [p], i0: i });
    });
    items.forEach(function (it, k) {
      it.n = k + 1;
      var seen = [];
      it.ps.forEach(function (q) { issues(q).forEach(function (t) { if (seen.indexOf(t) < 0) seen.push(t); }); });
      it.is = seen;
    });
    // Group by unit (the app sends photos already in unit order: Unit 1, Unit 2…, Common Areas, then untagged).
    var hasUnits = photos.some(function (p) { return p.u; });
    var groups = [];
    items.forEach(function (it) {
      var p = it.ps[0];
      var name = hasUnits ? (p.u ? str(p.u, 40) : 'Other photos') : '';
      var g = groups.length && groups[groups.length - 1].name === name ? groups[groups.length - 1] : null;
      if (!g) { g = { name: name, items: [] }; groups.push(g); }
      g.items.push(it);
    });
    var countIssues = function (g) { return g.items.reduce(function (n, it) { return n + it.is.length; }, 0); };
    var countPhotos = function (g) { return g.items.reduce(function (n, it) { return n + it.ps.length; }, 0); };

    main.appendChild(el('p', { class: 'sec-h', text: 'Summary' }));
    var sumWrap = el('div', { class: 'sum-g' });
    groups.forEach(function (g) {
      if (g.name) sumWrap.appendChild(el('h4', { text: g.name }));
      var sum = el('ol', { class: 'sum' });
      g.items.forEach(function (it) {
        var st = el('span', { class: 'st' });
        if (it.is.length) it.is.forEach(function (t, k) { if (k) st.appendChild(el('br')); st.appendChild(document.createTextNode(str(t))); });
        else st.appendChild(el('em', { text: 'No comment' }));
        if (it.ps.length > 1) st.appendChild(el('em', { text: ' · ' + it.ps.length + ' photos' }));
        sum.appendChild(el('li', {}, [el('span', { class: 'rn', text: String(it.n) }), st]));
      });
      sumWrap.appendChild(sum);
    });
    main.appendChild(sumWrap);

    groups.forEach(function (g) {
      if (g.name) {
        var n = countIssues(g), np = countPhotos(g);
        main.appendChild(el('h2', { class: 'unit-h' }, [document.createTextNode(g.name), el('span', { text: np + (np === 1 ? ' photo' : ' photos') + ' · ' + n + (n === 1 ? ' issue' : ' issues') })]));
      } else main.appendChild(el('p', { class: 'sec-h', text: 'Photos' }));
      g.items.forEach(function (it) { main.appendChild(reportRow(it, it.n)); });
    });
  } else {
    app.appendChild(header());
    if (!photos.length) main.appendChild(el('p', { class: 'missing', text: 'No photos in this link.' }));
    photos.forEach(function (p, i) { main.appendChild(card(p, i)); });
  }
  main.appendChild(el('footer', { text: 'Shared with CamStorage' }));
  app.appendChild(main);

  // ---------- open photo ----------
  var V = document.getElementById('viewer');
  var stage = document.getElementById('vStage');
  var strip = document.getElementById('vStrip');
  var panel = document.getElementById('vPanel');
  var cur = 0, img = null, z = { s: 1, x: 0, y: 0 }, lastFocus = null;

  photos.forEach(function (p, i) {
    var t = el('button', { 'aria-label': 'Photo ' + (i + 1) });
    t.appendChild(el('img', { src: thumb(p.i, 200), alt: '', loading: 'lazy' }));
    t.addEventListener('click', function () { show(i); });
    strip.appendChild(t);
  });

  function applyZ() { if (img) img.style.transform = 'translate(' + z.x + 'px,' + z.y + 'px) scale(' + z.s + ')'; }
  function resetZ() { z = { s: 1, x: 0, y: 0 }; applyZ(); }
  // Keep the zoomed picture from sliding off screen.
  function clampZ() {
    if (!img) return;
    if (z.s <= 1) { resetZ(); return; }
    var r = stage.getBoundingClientRect(), w = img.offsetWidth * z.s, h = img.offsetHeight * z.s;
    var ox = img.offsetLeft, oy = img.offsetTop;
    var minX = Math.min(0, r.width - w) - ox, maxX = Math.max(0, r.width - w) - ox;
    var minY = Math.min(0, r.height - h) - oy, maxY = Math.max(0, r.height - h) - oy;
    if (w <= r.width) z.x = (r.width - w) / 2 - ox; else z.x = Math.min(maxX, Math.max(minX, z.x));
    if (h <= r.height) z.y = (r.height - h) / 2 - oy; else z.y = Math.min(maxY, Math.max(minY, z.y));
    applyZ();
  }
  // Zoom to scale s around a point (px, py) in stage coordinates.
  function zoomAt(s, px, py) {
    s = Math.min(5, Math.max(1, s));
    var ox = img.offsetLeft, oy = img.offsetTop;
    var lx = (px - ox - z.x) / z.s, ly = (py - oy - z.y) / z.s;
    z.s = s; z.x = px - ox - lx * s; z.y = py - oy - ly * s;
    clampZ();
  }

  function show(i) {
    cur = (i + photos.length) % photos.length;
    var p = photos[cur];
    document.getElementById('vPos').textContent = (cur + 1) + ' / ' + photos.length;
    document.getElementById('vDl').href = dl(p.i);
    document.getElementById('vZoom').style.visibility = p.k === 'v' ? 'hidden' : 'visible';
    Array.prototype.forEach.call(stage.querySelectorAll('img,iframe,.missing'), function (n) { n.remove(); });
    if (p.k === 'v') {
      img = null;
      stage.insertBefore(el('iframe', { src: 'https://drive.google.com/file/d/' + encodeURIComponent(p.i) + '/preview', allow: 'autoplay; fullscreen', allowfullscreen: '', title: 'Video ' + (cur + 1) }), stage.firstChild);
    } else {
      img = el('img', { src: thumb(p.i, 2400), alt: p.n ? str(p.n, 120) : 'Photo ' + (cur + 1), draggable: 'false' });
      img.onerror = function () { this.remove(); stage.insertBefore(el('div', { class: 'missing', text: 'This photo is no longer shared.' }), stage.firstChild); img = null; };
      stage.insertBefore(img, stage.firstChild);
      resetZ();
    }
    Array.prototype.forEach.call(strip.children, function (t, k) { t.classList.toggle('on', k === cur); });
    var on = strip.children[cur];
    if (on) on.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    renderPanel(p);
    document.getElementById('vScroll').scrollTop = 0;
  }

  function renderPanel(p) {
    panel.innerHTML = '';
    var any = false;
    if (showDetails && (p.b || p.w || p.g || data.a)) {
      var lines = [];
      if (p.w) lines.push(fmtDate(p.w, true));
      if (p.u) lines.push(str(p.u, 40));
      if (data.a) lines.push(str(data.a, 200).split(',')[0]);
      var d = el('p', { class: 'd', text: lines.join(' · ') });
      var box = el('div', {}, [el('p', { class: 'n', text: p.b ? str(p.b, 80) : 'Photo ' + (cur + 1) }), d]);
      if (p.g && /^-?\d+(\.\d+)?,-?\d+(\.\d+)?$/.test(p.g)) {
        var gl = el('a', { href: 'https://www.google.com/maps?q=' + p.g, target: '_blank', rel: 'noopener', text: 'Map: ' + p.g });
        box.appendChild(el('p', { class: 'd' }, [gl]));
      }
      panel.appendChild(el('div', { class: 'by' }, [el('div', { class: 'avatar', text: initials(p.b) }), box]));
      any = true;
    }
    if (Array.isArray(p.is) && p.is.length) {
      var ib = el('div', { class: 'sec iss-panel' }, [el('p', { class: 'lbl', text: 'ISSUES' })]);
      var iul = el('ul');
      p.is.slice(0, 50).forEach(function (t) { if (typeof t === 'string' && t.trim()) iul.appendChild(el('li', { text: str(t) })); });
      ib.appendChild(iul);
      panel.appendChild(ib);
      any = true;
    }
    if (p.n) { panel.appendChild(el('p', { class: 'note', text: str(p.n) })); any = true; }
    if (Array.isArray(p.tg) && p.tg.length) {
      var tg = el('div', { class: 'tags' });
      p.tg.slice(0, 30).forEach(function (t) { tg.appendChild(el('span', { text: '#' + str(t, 40) })); });
      panel.appendChild(tg); any = true;
    }
    if (Array.isArray(p.vn) && p.vn.length) {
      var s = el('div', { class: 'sec' }, [el('p', { class: 'lbl', text: p.vn.length === 1 ? 'VOICE NOTE' : 'VOICE NOTES (' + p.vn.length + ')' })]);
      p.vn.forEach(function (v) {
        if (!Array.isArray(v) || !okId(v[0])) return;
        var box = el('div', { class: 'vn' });
        var meta = [str(v[3], 80), fmtDate(v[4]), v[1] ? fmtSec(v[1]) : ''].filter(Boolean).join(' · ');
        if (meta) box.appendChild(el('span', { class: 'w', text: meta }));
        var au = el('audio', { controls: '', preload: 'none', src: dl(v[0]) });
        box.appendChild(au);
        if (v[2]) box.appendChild(el('p', { class: 'tx', text: '“' + str(v[2]) + '”' }));
        s.appendChild(box);
      });
      panel.appendChild(s); any = true;
    }
    if (Array.isArray(p.cm) && p.cm.length) {
      var cs = el('div', { class: 'sec' }, [el('p', { class: 'lbl', text: 'COMMENTS (' + p.cm.length + ')' })]);
      p.cm.forEach(function (c) {
        if (!Array.isArray(c)) return;
        var a = el('p', { class: 'a', text: str(c[0], 80) || 'Comment' });
        if (c[1]) a.appendChild(el('span', { text: fmtDate(c[1]) }));
        cs.appendChild(el('div', { class: 'cm' }, [a, el('p', { class: 't', text: str(c[2]) })]));
      });
      panel.appendChild(cs); any = true;
    }
    panel.style.display = any ? 'flex' : 'none';
  }

  function openViewer(i) {
    lastFocus = document.activeElement;
    V.classList.add('open');
    document.body.style.overflow = 'hidden';
    show(i);
    document.getElementById('vClose').focus();
    history.pushState({ v: 1 }, '', location.href);
  }
  function closeViewer(fromPop) {
    if (!V.classList.contains('open')) return;
    V.classList.remove('open');
    document.body.style.overflow = '';
    Array.prototype.forEach.call(stage.querySelectorAll('iframe'), function (n) { n.remove(); });
    Array.prototype.forEach.call(panel.querySelectorAll('audio'), function (a) { a.pause(); });
    if (lastFocus) lastFocus.focus();
    if (!fromPop && history.state && history.state.v) history.back();
  }
  window.addEventListener('popstate', function () { closeViewer(true); });
  document.getElementById('vClose').addEventListener('click', function () { closeViewer(false); });
  document.getElementById('vPrev').addEventListener('click', function () { show(cur - 1); });
  document.getElementById('vNext').addEventListener('click', function () { show(cur + 1); });
  document.getElementById('vZoom').addEventListener('click', function () {
    if (!img) return;
    var r = stage.getBoundingClientRect();
    zoomAt(z.s >= 4 ? 1 : z.s * 2, r.width / 2, r.height / 2);
  });
  document.addEventListener('keydown', function (e) {
    if (!V.classList.contains('open')) return;
    if (e.key === 'Escape') closeViewer(false);
    else if (e.key === 'ArrowRight') show(cur + 1);
    else if (e.key === 'ArrowLeft') show(cur - 1);
  });

  // Touch and mouse: pinch to zoom, drag while zoomed, double-tap to zoom, swipe to move between photos.
  var pts = {}, start = null, lastTap = 0, moved = false;
  function local(e) { var r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function two() { var k = Object.keys(pts); return k.length >= 2 ? [pts[k[0]], pts[k[1]]] : null; }
  stage.addEventListener('pointerdown', function (e) {
    if (!img || e.target.closest('.nav')) return;
    stage.setPointerCapture(e.pointerId);
    pts[e.pointerId] = local(e);
    moved = false;
    var t = two();
    if (t) start = { d: Math.hypot(t[0].x - t[1].x, t[0].y - t[1].y), s: z.s, cx: (t[0].x + t[1].x) / 2, cy: (t[0].y + t[1].y) / 2 };
    else start = { x: pts[e.pointerId].x, y: pts[e.pointerId].y, zx: z.x, zy: z.y };
  });
  stage.addEventListener('pointermove', function (e) {
    if (!img || !pts[e.pointerId] || !start) return;
    pts[e.pointerId] = local(e);
    var t = two();
    if (t && start.d) {
      var d = Math.hypot(t[0].x - t[1].x, t[0].y - t[1].y);
      zoomAt(start.s * d / start.d, start.cx, start.cy);
      moved = true;
    } else if (!t && start.x != null) {
      var dx = pts[e.pointerId].x - start.x, dy = pts[e.pointerId].y - start.y;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
      if (z.s > 1) { z.x = start.zx + dx; z.y = start.zy + dy; clampZ(); }
    }
  });
  function end(e) {
    if (!pts[e.pointerId]) return;
    var p = pts[e.pointerId];
    delete pts[e.pointerId];
    if (Object.keys(pts).length) { var k = Object.keys(pts)[0]; start = { x: pts[k].x, y: pts[k].y, zx: z.x, zy: z.y }; return; }
    if (start && start.x != null && z.s <= 1 && moved) {
      var dx = p.x - start.x;
      if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
    } else if (!moved) {
      var now = Date.now();
      if (now - lastTap < 300) { zoomAt(z.s > 1 ? 1 : 2.5, p.x, p.y); lastTap = 0; } else lastTap = now;
    }
    start = null;
  }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('wheel', function (e) {
    if (!img) return;
    e.preventDefault();
    var p = local(e);
    zoomAt(z.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), p.x, p.y);
  }, { passive: false });
  window.addEventListener('resize', clampZ);
})();
</script>
</body>
</html>
